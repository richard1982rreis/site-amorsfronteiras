        /* =====================================================================
   HÉLIOS · Visual no padrão do site Amor Sem Fronteiras
   (mesmas cores, fontes, cantos e botões do app de frases)
   As classes são as mesmas do app original: só o visual mudou.
   ===================================================================== */

/* 1) Cores e medidas da marca (mudar aqui muda o app todo) */
:root{
  --azul-marinho:#14224d;          /* texto principal e frases */
  --azul-suave:#5a6b8f;            /* rótulos em fonte mono */
  --azul-meta:#3d6c8e;             /* destaques frios */
  --carmim:#c8213f;                /* botão principal e destaques */
  --carmim-escuro:#a8182f;
  --rosa-selo:#f4d9e3;             /* fundo dos selos */
  --branco-vidro:rgba(255,255,255,.78);
  --linha:rgba(20,34,77,.10);
  --sombra:0 10px 30px rgba(60,50,120,.10);
  --raio:26px;
  --serif:"Instrument Serif","Iowan Old Style",Georgia,serif;
  --sans:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  /* nomes antigos que o app ainda usa */
  --bg:#ebe8f6;--card:rgba(255,255,255,.86);--ink:var(--azul-marinho);--muted:var(--azul-suave);--line:var(--linha);
}

/* 2) Base: fundo em degradê azul-claro -> rosa, igual ao site */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:#ebe8f6}
body{margin:0;min-height:100dvh;font-family:var(--sans);color:var(--azul-marinho);background:linear-gradient(180deg,#e3eefc 0%,#ebe8f6 45%,#fbe6ee 100%)}
button,a,input{font-family:inherit;color:inherit}
button,a{cursor:pointer}
a{text-decoration:none}
.app-shell{min-height:100dvh;padding:0 0 env(safe-area-inset-bottom);background:none}
.wrap{width:min(1060px,calc(100% - 40px));margin:auto;padding:22px 0 28px}

/* 3) Topo: logo redondo, nome da marca e título */
.voltar{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--linha);background:var(--branco-vidro);font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--azul-marinho)}
.hero{text-align:center;padding:14px 12px 26px}
.hero .voltar{margin-bottom:18px}
.sun-mark{width:92px;height:92px;border-radius:50%;margin:0 auto;background:url(icons/helios-icon-192.png) center/cover no-repeat;box-shadow:0 6px 20px rgba(60,50,120,.28);display:block}
.sun-mark>*{display:none}
.eyebrow{margin:20px 0 6px;font:500 12px/1.3 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--azul-suave)}
.hero h1{margin:0;font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(64px,15vw,108px);line-height:.95;letter-spacing:-.01em;color:var(--azul-marinho)}
.subtitle{margin:10px 0 4px;font-family:var(--serif);font-size:clamp(24px,5.4vw,36px);font-weight:400;line-height:1.15}
.shine{margin:8px 0 0;font-family:var(--serif);font-style:italic;font-size:20px;color:var(--carmim)}
.promise{max-width:640px;margin:16px auto 0;color:var(--azul-marinho);font-size:17px;line-height:1.55}
.badge{display:inline-flex;align-items:center;gap:7px;background:var(--rosa-selo);color:var(--carmim);border-radius:14px;padding:10px 14px;font:700 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase}

/* 4) Cartões de vidro */
.card{background:rgba(255,255,255,.86);border:1px solid var(--linha);border-radius:30px;box-shadow:var(--sombra)}
.about{display:flex;gap:20px;padding:26px;margin-bottom:18px}
.about-icon{font-size:34px;width:60px;height:60px;border-radius:50%;background:var(--rosa-selo);display:grid;place-items:center;flex:none}
.section-kicker{margin:0 0 8px;font:500 11.5px/1.3 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--azul-suave)}
.about h2,.controls-head h2,.results-head h2,.safety h2,.reminders h2{margin:0 0 10px;font-family:var(--serif);font-weight:400;font-size:clamp(26px,6vw,32px);line-height:1.12}
.about p{margin:0 0 10px;font-size:16.5px;line-height:1.65;color:var(--azul-marinho)}

/* 5) Controles */
.controls{padding:26px}
.controls-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.live{display:inline-flex;align-items:center;gap:7px;background:rgba(61,108,142,.12);color:var(--azul-meta);padding:9px 12px;border-radius:999px;font:500 12px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--azul-meta)}
.field-label{margin:22px 0 10px;font:500 12px/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--azul-suave)}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode-btn{display:flex;flex-direction:column;gap:4px;padding:18px;text-align:left;border:1.5px solid var(--linha);border-radius:22px;background:var(--branco-vidro);color:var(--azul-marinho);transition:transform .1s}
.mode-btn:active{transform:scale(.985)}
.mode-btn.active{border-color:var(--carmim);background:#fff;box-shadow:0 0 0 3px rgba(200,33,63,.12)}
.mode-btn.active.poetico{border-color:var(--azul-meta);background:#fff;box-shadow:0 0 0 3px rgba(61,108,142,.16)}
.mode-emoji{font-size:26px}
.mode-btn strong{font-family:var(--serif);font-weight:400;font-size:24px;line-height:1.1}
.mode-btn small{color:var(--azul-suave);font-size:14px;line-height:1.4}
.form-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:14px;margin-top:20px}
.field label{display:block;margin-bottom:8px;font:500 12px/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--azul-suave)}
.optional{font-weight:400;text-transform:none;letter-spacing:.02em}
.field input{width:100%;min-height:50px;padding:12px 16px;border:1px solid var(--linha);border-radius:18px;background:rgba(255,255,255,.92);color:var(--azul-marinho);font-size:16px;outline:none}
.field input:focus{border-color:var(--carmim);box-shadow:0 0 0 3px rgba(200,33,63,.14)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip,.filter-btn{min-height:40px;padding:10px 14px;border:1px solid var(--linha);border-radius:999px;background:var(--branco-vidro);color:var(--azul-marinho);font:500 12px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;transition:transform .1s}
.chip:active,.filter-btn:active{transform:scale(.96)}
.chip.active,.filter-btn.active{background:var(--carmim);border-color:transparent;color:#fff;font-weight:700}
.period-filter{display:flex;flex-wrap:wrap;gap:8px}
.guidance{margin:24px 0 18px;padding:15px 16px;border-left:4px solid var(--carmim);border-radius:6px 16px 16px 6px;background:rgba(244,217,227,.55);font-size:15.5px;line-height:1.6}
.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.primary{display:flex;align-items:center;justify-content:center;gap:9px;min-height:54px;padding:0 22px;border:0;border-radius:20px;background:var(--carmim);color:#fff;font:700 16.5px/1 var(--sans);box-shadow:0 8px 22px rgba(200,33,63,.28);transition:transform .1s,background .15s}
.primary:hover{background:var(--carmim-escuro)}
.primary:active{transform:scale(.985)}
.secondary{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 20px;border:1px solid var(--linha);border-radius:20px;background:var(--branco-vidro);color:var(--azul-marinho);font:600 16px/1 var(--sans);box-shadow:var(--sombra)}
.clear{display:flex;gap:7px;align-items:center;min-height:44px;padding:0 14px;border:0;background:transparent;color:var(--azul-suave);font:600 15px/1 var(--sans)}
.notice{min-height:20px;margin:12px 0 0;color:var(--azul-meta);font:400 13px/1.5 var(--mono)}

/* 6) Resultados: os 3 Ois */
.results{padding:28px 0 10px}
.results-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
.counter{padding:10px 14px;border:1px solid var(--linha);border-radius:999px;background:var(--branco-vidro);font:400 12px/1.2 var(--mono);color:var(--azul-meta);white-space:nowrap}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:18px}
.phrase-card{display:flex;flex-direction:column;min-height:350px;padding:24px 22px 22px;border:1px solid var(--linha);border-top:5px solid var(--period);border-radius:30px;background:rgba(255,255,255,.88);box-shadow:var(--sombra)}
.phrase-card.dim{opacity:.42}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.period-pill{padding:8px 11px;border-radius:12px;background:var(--soft);color:var(--period);font:700 11.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase}
.mode-pill{font:400 11px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--azul-suave);text-align:right}
.period-icon{width:46px;height:46px;margin:20px 0 10px;border-radius:50%;background:var(--soft);color:var(--period);display:grid;place-items:center}
.phrase-card h3{margin:0;font-family:var(--serif);font-weight:400;font-size:27px;line-height:1.12}
.para{margin:7px 0 0;color:var(--carmim);font-weight:700}
.phrase-text{margin:14px 0 auto;font-family:var(--serif);font-size:clamp(22px,5.6vw,26px);line-height:1.3;letter-spacing:-.005em;color:var(--azul-marinho);overflow-wrap:anywhere}
.card-actions{display:flex;gap:10px;margin-top:22px}
.copy-btn{display:flex;gap:7px;align-items:center;justify-content:center;flex:1;min-height:48px;padding:0 14px;border:1px solid var(--linha);border-radius:16px;background:var(--branco-vidro);color:var(--azul-marinho);font:600 15px/1 var(--sans)}
.wa-btn{display:flex;gap:7px;align-items:center;justify-content:center;flex:1;min-height:48px;padding:0 14px;border:0;border-radius:16px;background:var(--carmim);color:#fff;font:700 15px/1 var(--sans);box-shadow:0 6px 16px rgba(200,33,63,.24)}
.bank-note{text-align:center;color:var(--azul-suave);font:400 12px/1.5 var(--mono)}
.empty{text-align:center;padding:42px 22px}
.empty .big-sun{font-size:50px}
.empty h3{margin:8px;font-family:var(--serif);font-weight:400;font-size:28px}
.empty p{max-width:540px;margin:auto;line-height:1.6;color:var(--azul-suave)}

/* 7) Aviso de cuidado e rodapé */
.safety{display:flex;gap:20px;padding:26px;margin-top:18px}
.safety-icon{font-size:34px}
.safety p{margin:0 0 8px;font-size:15.5px;line-height:1.65;color:var(--azul-marinho)}
footer{text-align:center;padding:30px 10px 10px}
footer p{max-width:760px;margin:10px auto;color:var(--azul-suave);font:400 12px/1.6 var(--mono);letter-spacing:.04em}
footer small{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--azul-suave)}

/* 8) Lembretes */
.reminders{padding:26px;margin-top:18px;border:1.5px solid rgba(200,33,63,.28)}
.reminders-head{display:flex;align-items:flex-start;gap:16px}
.reminders-icon{flex:0 0 auto;width:54px;height:54px;border-radius:50%;background:var(--rosa-selo);display:grid;place-items:center;font-size:26px}
.reminder-state{margin-left:auto;display:inline-flex;align-items:center;gap:7px;padding:9px 12px;border-radius:999px;background:rgba(20,34,77,.07);color:var(--azul-suave);font:500 12px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.reminder-state.on{background:rgba(61,108,142,.14);color:var(--azul-meta)}
.reminders-intro,.privacy-note{font-size:16.5px;line-height:1.65;color:var(--azul-marinho)}
.preview-note{padding:13px 15px;border:1px solid rgba(61,108,142,.22);border-radius:16px;background:rgba(227,238,252,.75);font-size:14.5px;line-height:1.6;color:var(--azul-marinho)}
.reminder-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}
.reminder-big{flex:1}
.reminder-status{margin:12px 0 0;color:var(--azul-meta);font:400 13px/1.55 var(--mono)}
.reminder-status.on{color:var(--azul-meta);font-weight:700}
.preview-popup{margin-top:16px;padding:16px;border:1px solid var(--linha);border-left:5px solid var(--carmim);border-radius:18px;background:#fff;box-shadow:var(--sombra)}
.preview-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.preview-top span{display:flex;align-items:center;gap:8px;font-size:14px}
.preview-close{display:grid;place-items:center;width:34px;height:34px;border:0;border-radius:50%;background:rgba(20,34,77,.07)}
.preview-popup p{margin:12px 0;font-family:var(--serif);font-size:22px;line-height:1.3}
.preview-copy{max-width:220px}
.preview-actions{display:flex;gap:10px;flex-wrap:wrap}
.preview-wa{flex:0 0 auto;padding:0 18px}
.reminder-list{display:grid;gap:0;margin-top:18px}
.reminder-row{padding:16px;border:1px solid var(--linha);border-left:5px solid var(--period);border-radius:20px;background:rgba(255,255,255,.9)}
.reminder-row+.reminder-row{margin-top:14px}
.reminder-row-head{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.reminder-row-head strong{font-family:var(--serif);font-weight:400;font-size:22px}
.time-field{display:flex;align-items:center;gap:8px;font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--azul-suave)}
.time-field input{min-height:42px;padding:8px 12px;border:1px solid var(--linha);border-radius:14px;background:#fff;color:var(--azul-marinho);font:500 16px/1 var(--mono)}
.reminder-text{margin:10px 0;font-size:16.5px;line-height:1.6}
.reminder-question{margin:14px 0 6px;font-size:16.5px;line-height:1.55;font-weight:700}
.reminder-phrase{margin:0 0 14px;font-family:var(--serif);font-size:21px;line-height:1.3}
.reminder-row-foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.reminder-copy,.reminder-wa{flex:0 0 auto;padding:0 18px}
.reminder-wa.disabled{opacity:.45;cursor:default}
.text-btn{padding:4px 0;border:0;background:transparent;color:var(--azul-marinho);font-weight:700;text-decoration:underline}
.text-btn:disabled{opacity:.45;text-decoration:none;cursor:default}
.gentle-note{margin-top:14px;padding:12px 14px;border-radius:16px;background:rgba(227,238,252,.75);line-height:1.55}
.next-times{margin-top:20px}
.next-times h3{margin:0 0 10px;font-family:var(--serif);font-weight:400;font-size:22px}
.next-times ol{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.next-times li{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:12px 14px;border-radius:16px;background:rgba(227,238,252,.7);font:400 13px/1.4 var(--mono)}
.next-dot{display:inline-block;width:10px;height:10px;margin-right:7px;border-radius:50%}

/* 9) Celular */
@media(max-width:760px){
  .wrap{width:calc(100% - 32px);padding-top:16px}
  .about,.safety,.controls,.reminders{padding:20px}
  .form-grid,.mode-grid,.cards{grid-template-columns:1fr}
  .controls-head,.results-head,.reminders-head{align-items:flex-start;flex-direction:column}
  .counter{white-space:normal}
  .phrase-card{min-height:0}
  .actions,.reminder-actions{flex-direction:column;align-items:stretch}
  .clear{align-self:center}
  .hero{padding-top:6px}
  .about,.safety{flex-direction:column}
  .reminder-state{margin-left:0}
  .preview-copy{max-width:none}
}

<!-- HÉLIOS · Lembretes reais: cria o arquivo de calendário (.ics) e a notificação de teste -->
<script>
window.__helios = (function () {
  "use strict";
  var DOMINIO = "amorsfronteiras.com.br";
  var DIAS = 30;

  function dois(n) { return (n < 10 ? "0" : "") + n; }
  function dataLocal(d) { return d.getFullYear() + dois(d.getMonth() + 1) + dois(d.getDate()); }
  function agoraUTC() {
    var d = new Date();
    return d.getUTCFullYear() + dois(d.getUTCMonth() + 1) + dois(d.getUTCDate()) + "T" +
           dois(d.getUTCHours()) + dois(d.getUTCMinutes()) + dois(d.getUTCSeconds()) + "Z";
  }
  // texto do calendário: escapa \ ; , e quebras de linha (regra do formato .ics)
  function esc(t) { return String(t).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n"); }
  // o formato exige linhas de no máximo 75 bytes; dobra sem cortar letras acentuadas ou emojis ao meio
  function dobrar(linha) {
    var enc = new TextEncoder(), partes = [], atual = "", bytes = 0;
    for (var ch of linha) {
      var b = enc.encode(ch).length;
      if (bytes + b > 75) { partes.push(atual); atual = " " + ch; bytes = 1 + b; }
      else { atual += ch; bytes += b; }
    }
    partes.push(atual);
    return partes.join("\r\n");
  }
  function urlDoApp() { return location.href.split("#")[0].split("?")[0]; }

  function baixar(texto) {
    var blob = new Blob([texto], { type: "text/calendar;charset=utf-8" });
    var u = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = u; a.download = "helios-lembretes.ics"; a.style.display = "none";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(u); }, 15000);
  }

  /* itens: [{dia (0 = hoje), id, rotulo, hora "08:00", pergunta, frase|null}]
     comFrase=true  -> um evento por dia, cada um com a sua frase (só horários que ainda não passaram hoje)
     comFrase=false -> um evento por período que se repete todo dia (só o aviso) */
  function agendar(itens, comFrase) {
    var agora = new Date(), url = urlDoApp(), stamp = agoraUTC(), seq = Math.floor(Date.now() / 60000);
    var linhas = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Amor Sem Fronteiras//Helios//PT-BR",
                  "CALSCALE:GREGORIAN", "METHOD:PUBLISH", "X-WR-CALNAME:Hélios"];
    var criados = 0;
    itens.forEach(function (it) {
      var m = /^(\d{1,2}):(\d{2})$/.exec(it.hora || ""), hh = m ? +m[1] : 8, mm = m ? +m[2] : 0;
      var dia = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate() + it.dia, hh, mm, 0);   // horário LOCAL do celular
      if (dia.getTime() <= agora.getTime()) { if (comFrase) return; dia.setDate(dia.getDate() + 1); }   // já passou: pula (com frase) ou começa amanhã (fixo)
      var resumo = "Hélios · " + it.rotulo + ": " + it.pergunta;
      var desc = (comFrase && it.frase)
        ? it.pergunta + "\n\nSua frase:\n“" + it.frase + "”\n\nAbrir o Hélios: " + url
        : it.pergunta + "\n\nAbra o Hélios para pegar a frase de hoje: " + url;
      // UID estável: importar de novo atualiza os mesmos avisos em vez de duplicar
      var uid = comFrase ? "helios-" + dataLocal(dia) + "-" + it.id + "@" + DOMINIO : "helios-fixo-" + it.id + "@" + DOMINIO;
      var ev = ["BEGIN:VEVENT", "UID:" + uid, "DTSTAMP:" + stamp, "LAST-MODIFIED:" + stamp, "SEQUENCE:" + seq,
                "DTSTART:" + dataLocal(dia) + "T" + dois(dia.getHours()) + dois(dia.getMinutes()) + "00",   // sem fuso: vale o relógio do celular
                "DURATION:PT10M", "SUMMARY:" + esc(resumo), "DESCRIPTION:" + esc(desc), "URL:" + url,
                "TRANSP:TRANSPARENT", "STATUS:CONFIRMED"];
      if (!comFrase) ev.push("RRULE:FREQ=DAILY");
      ev.push("BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:" + esc(resumo), "TRIGGER:PT0M", "END:VALARM", "END:VEVENT");
      linhas = linhas.concat(ev); criados++;
    });
    linhas.push("END:VCALENDAR");
    baixar(linhas.map(dobrar).join("\r\n") + "\r\n");
    return comFrase
      ? "Pronto! Criei " + criados + " lembretes (3 por dia, por " + DIAS + " dias) com a frase de cada Oi. Agora abra o arquivo helios-lembretes.ics que acabou de baixar e confirme em Adicionar no Calendário. Os avisos tocam na hora certa, mesmo com o app fechado."
      : "Pronto! Criei 3 lembretes diários fixos (só o aviso). Abra o arquivo helios-lembretes.ics que acabou de baixar e confirme no Calendário. Para ver a frase do dia, toque no aviso e abra o Hélios.";
  }

  // notificação de teste (aparece como um aviso de verdade no celular, se o usuário permitir)
  function notificar(titulo, pergunta, frase) {
    if (!("Notification" in window)) return false;
    function mostrar() {
      var opcoes = { body: pergunta + "\n" + frase, icon: "icons/helios-icon-192.png", badge: "icons/helios-icon-192.png", tag: "helios-teste" };
      var simples = function () { try { new Notification(titulo, opcoes); } catch (e) {} };
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistration) {
        navigator.serviceWorker.getRegistration().then(function (r) { if (r && r.showNotification) r.showNotification(titulo, opcoes).catch(simples); else simples(); }, simples);
      } else { simples(); }
    }
    if (Notification.permission === "granted") mostrar();
    else if (Notification.permission !== "denied") Notification.requestPermission().then(function (p) { if (p === "granted") mostrar(); });
    return true;
  }

  return { agendar: agendar, notificar: notificar };
})();
</script>
